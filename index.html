<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jox — Simply Just Me</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Permanent+Marker&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- BACKGROUND VIDEO -->

<video class="background-video" autoplay muted loop playsinline>
    <source src="background - Copy.mp4" type="video/mp4">
</video>


    <!-- DARK OVERLAY -->

    <div class="overlay"></div>


    <!-- TOP BAR -->

    <header class="topbar">

        <div class="logo">
            <span></span>
            JOX
        </div>

        <div class="top-right">
            SIMPLY JUST ME
        </div>

    </header>


    <!-- MAIN -->

    <main class="hero">

        <div class="hero-content">

            <div class="hello">
                H E Y !
            </div>


            <h1>
                I'M <span>JOX.</span>
            </h1>


            <p class="subtitle">
                Nice to meet you.
            </p>


            <p class="description">
                From Philippines, Living in Japan,<br>
                just chilling everyday!
            </p>


            <div class="social-title">
                Check out my Socials!
            </div>


            <!-- SOCIAL BUTTONS -->

            <div class="socials">

                <!-- DISCORD -->

                <a
                    href="https://discord.gg/mZgBJ42VbT"
                    target="_blank"
                    class="social discord"
                    aria-label="Discord"
                >
                    <i class="fa-brands fa-discord"></i>
                </a>


                <!-- INSTAGRAM -->

                <a
                    href="https://www.instagram.com/j0x_x1/"
                    target="_blank"
                    class="social instagram"
                    aria-label="Instagram"
                >
                    <i class="fa-brands fa-instagram"></i>
                </a>


                <!-- ROBLOX -->

                <a
                    href="https://www.roblox.com/communities/427441976/SK-Serial-Killers#!/about"
                    target="_blank"
                    class="social roblox"
                    aria-label="Roblox"
                >
                    <i class="fa-solid fa-cube"></i>
                </a>

            </div>

        </div>

    </main>


    <!-- MUSIC PLAYER -->

    <div class="music-player">

        <button id="musicButton" aria-label="Play music">

            <i id="musicIcon" class="fa-solid fa-play"></i>

        </button>

        <div class="music-info">

            <strong>
                In da Party
            </strong>

            <span>
                chill / just chilling
            </span>

        </div>

        <div class="sound-wave">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>

    </div>



    <script src="script.js"></script>

</body>

</html>
