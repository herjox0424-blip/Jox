<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jox — Simply Just Me</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Permanent+Marker&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- BACKGROUND VIDEO -->

<video id="backgroundVideo" class="background-video" autoplay muted loop playsinline>
    <source src="background - Copy.mp4" type="video/mp4">
</video>

<div class="music-player" id="musicPlayer">
    <button class="music-play" id="musicButton" aria-label="Play music">
        <span id="musicIcon">▶</span>
    </button>

    <div class="music-info">
        <div class="music-title">In da Party</div>
        <div class="music-subtitle">just chilling</div>
    </div>

    <div class="equalizer" id="equalizer">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>


    <!-- DARK OVERLAY -->

    <div class="overlay"></div>


    <!-- TOP BAR -->

    <header class="topbar">

        <div class="logo">
            <span></span>
            JOX
        </div>

        <div class="top-right">
            SIMPLY JUST ME
        </div>

    </header>


    <!-- MAIN -->

    <main class="hero">

        <div class="hero-content">

            <div class="hello">
                H E Y !
            </div>


            <h1>
                I'M <span>JOX.</span>
            </h1>


            <p class="subtitle">
                Nice to meet you.
            </p>


            <p class="description">
                From Philippines, Living in Japan,<br>
                just chilling everyday!
            </p>


            <div class="social-title">
                Check out my Socials!
            </div>


            <!-- SOCIAL BUTTONS -->

            <div class="socials">

                <!-- DISCORD -->

                <a
                    href="https://discord.gg/mZgBJ42VbT"
                    target="_blank"
                    class="social discord"
                    aria-label="Discord"
                >
                    <i class="fa-brands fa-discord"></i>
                </a>


                <!-- INSTAGRAM -->

                <a
                    href="https://www.instagram.com/j0x_x1/"
                    target="_blank"
                    class="social instagram"
                    aria-label="Instagram"
                >
                    <i class="fa-brands fa-instagram"></i>
                </a>


                <!-- ROBLOX -->

                <a
                    href="https://www.roblox.com/users/10076756274/profile"
                    target="_blank"
                    class="social roblox"
                    aria-label="Roblox"
                >
                    <i class="fa-solid fa-cube"></i>
                </a>

            </div>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
